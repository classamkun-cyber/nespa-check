<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ネスパ 出退勤チェック</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ネスパチェック">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  html { background: #101418; height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: #101418;
    color: #e8edf2;
    font-family: "Segoe UI", "Meiryo", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 24px; }

  .head { padding: calc(10px + env(safe-area-inset-top)) 2px 4px; }
  .head h1 {
    font-size: 19px; margin: 0; font-weight: 600;
    display: flex; align-items: baseline; gap: 8px;
    justify-content: center;
  }
  .head .ver { font-size: 11px; color: #6b7783; font-weight: normal; }

  /* タブ切り替え */
  .tabs {
    position: sticky; top: 0; z-index: 10; background: #101418;
    display: flex; gap: 8px; padding: 6px 0 10px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; border-radius: 10px;
    background: #1d232b; color: #9aa7b4; font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
  }
  .tab.active { background: #2f9e6a; color: #0b140f; }

  /* 進捗 */
  .progress-wrap { background: #1d232b; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: #9aa7b4; margin-bottom: 6px; }
  .progress-label b { color: #e8edf2; font-variant-numeric: tabular-nums; }
  .progress-bar-outer { height: 8px; background: #2b3541; border-radius: 4px; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: #2f9e6a; width: 0%; transition: width .2s ease; }
  .progress-bar-inner.done { background: #2f9e6a; }

  /* チェックリスト */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: center; gap: 10px;
    background: #1d232b; border-radius: 10px; padding: 12px 14px;
    font-size: 16px; cursor: pointer;
  }
  .item .box {
    width: 24px; height: 24px; min-width: 24px; border-radius: 6px;
    border: 2px solid #4a5560; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: transparent;
  }
  .item.checked { background: #16261e; }
  .item.checked .box { background: #2f9e6a; border-color: #2f9e6a; color: #0b140f; }
  .item.checked .label { color: #6b7783; text-decoration: line-through; }
  .item .label { flex: 1; }

  .footer-note { text-align: center; font-size: 12px; color: #6b7783; margin-top: 16px; }
  .reset-btn {
    display: block; margin: 18px auto 0; padding: 10px 20px;
    background: transparent; color: #6b7783; border: 1px solid #2b3541; border-radius: 8px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>ネスパ 出退勤チェック <span class="ver">v1.1</span></h1>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabIn" onclick="switchTab('in')">🌅 出勤時</button>
    <button class="tab" id="tabOut" onclick="switchTab('out')">🌇 退勤時</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-label"><span id="dateLabel"></span><b id="progressLabel">0/0</b></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
  </div>

  <div class="list" id="list"></div>

  <button class="reset-btn" onclick="resetCurrent()">このリストをリセット</button>
  <div class="footer-note">日付が変わると自動でまっさらになります</div>
</div>

<script>
const LISTS = {
  in: [
    "照明・空調　電源ON",
    "蓄冷剤札　付け替え",
    "ワースケ　印鑑",
    "スマホ・プリンター・PC電源ON",
    "ASPB　立ち上げ",
    "NSヘルプ　確認",
    "ANDES　開局",
    "NCR　立ち上げ　Zレポート　出力",
    "Vicmax　立ち上げ",
    "勤怠確認",
    "昨日売上・客数・欠品　確認",
    "ホワイトボード　記入",
    "個人情報存在確認表　印鑑",
    "現金売上　確認",
    "置き楽　回収　確認",
    "帳票類　ファイリング",
    "作業チェックリスト　印鑑",
    "HHT　台帳　記入",
    "1便　TMS連携",
    "1便　配管・顧客リスト　出力",
    "1便　ラベル　出力"
  ],
  out: [
    "欠品リスト　出力",
    "15時　メンテナンス",
    "集金管理表・ANDES送信　確認",
    "NCR　確認",
    "HHT　台帳　記入",
    "配管・受領書等　キャビネットへ",
    "部門別売上表　出力",
    "代金集金管理表　出力",
    "業務終了",
    "作業チェックリスト　印鑑",
    "翌日以降　注文　確認",
    "照明・空調　電源OFF"
  ]
};

let currentTab = 'in';

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function storageKey(tab) {
  return `nespaCheck-${todayStr()}-${tab}`;
}

function loadChecked(tab) {
  try {
    const raw = localStorage.getItem(storageKey(tab));
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveChecked(tab, arr) {
  localStorage.setItem(storageKey(tab), JSON.stringify(arr));
}

function cleanupOldKeys() {
  // 今日以外の日付キーは消しておく（たまったlocalStorage対策）
  const today = todayStr();
  const prefix = 'nespaCheck-';
  const keep = [`${prefix}${today}-in`, `${prefix}${today}-out`];
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (key && key.startsWith(prefix) && !keep.includes(key)) {
      localStorage.removeItem(key);
    }
  }
}

function render() {
  const items = LISTS[currentTab];
  const checked = loadChecked(currentTab);
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  items.forEach((label, i) => {
    const isChecked = checked.includes(i);
    const row = document.createElement('div');
    row.className = 'item' + (isChecked ? ' checked' : '');
    row.innerHTML = `<div class="box">✓</div><div class="label">${label}</div>`;
    row.onclick = () => toggle(i);
    listEl.appendChild(row);
  });

  const total = items.length;
  const done = checked.length;
  document.getElementById('progressLabel').textContent = `${done}/${total}`;
  const bar = document.getElementById('progressBar');
  bar.style.width = total ? `${(done / total) * 100}%` : '0%';
  bar.classList.toggle('done', done === total && total > 0);

  const d = new Date();
  document.getElementById('dateLabel').textContent =
    `${d.getMonth() + 1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`;
}

function toggle(i) {
  const checked = loadChecked(currentTab);
  const idx = checked.indexOf(i);
  if (idx >= 0) checked.splice(idx, 1);
  else checked.push(i);
  saveChecked(currentTab, checked);
  render();
}

function resetCurrent() {
  saveChecked(currentTab, []);
  render();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabIn').classList.toggle('active', tab === 'in');
  document.getElementById('tabOut').classList.toggle('active', tab === 'out');
  render();
}

cleanupOldKeys();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
